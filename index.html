<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pineapple Arcade</title>
<!-- anonymous visit/play counts (no cookies, no personal data); daily summary is sent by .github/workflows/daily-stats.yml -->
<script data-goatcounter="https://pineapplearcade.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍍</text></svg>">
<style>
:root{--bg:#0b0b14;--panel:#141425;--card:#1b1b30;--line:#2a2a45;--text:#ecebff;--dim:#9a98c0;--a:#ffc83d;--b:#ff4fa3;--c:#5ad1ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#2a1846 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#10324a 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.4 system-ui,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;padding:14px 24px;background:rgba(11,11,20,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;white-space:nowrap;cursor:pointer;text-decoration:none}
.logo span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:640px;position:relative}
.search input{width:100%;padding:12px 16px 12px 44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px;outline:none;transition:.15s}
.search input:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(255,79,163,.18)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px monospace;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;font:inherit;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--a);transform:translateY(-1px)}
.btn.hot{background:linear-gradient(90deg,var(--a),var(--b));color:#1a0b1a;border:0;font-weight:700}
main{padding:18px 24px 60px;max-width:1500px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;text-transform:capitalize;font-size:14px}
.chip.on{color:#140a14;background:var(--a);border-color:var(--a);font-weight:700}
h2{font-size:19px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
h2 small{color:var(--dim);font-weight:400;font-size:14px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:4px 2px 8px}
.row::-webkit-scrollbar{display:none}
.rowwrap{position:relative}
.arrow{position:absolute;top:4px;bottom:8px;width:52px;border:0;z-index:2;cursor:pointer;color:#fff;font-size:30px;opacity:0;transition:opacity .15s}
.arrow.l{left:0;border-radius:16px 0 0 16px;background:linear-gradient(90deg,rgba(11,11,20,.95),transparent)}
.arrow.r{right:0;border-radius:0 16px 16px 0;background:linear-gradient(270deg,rgba(11,11,20,.95),transparent)}
.rowwrap:hover .arrow{opacity:1}.rowwrap.fit .arrow{display:none}.arrow:hover{color:var(--a)}
html,.side{scrollbar-width:thin;scrollbar-color:#3a3a60 transparent}
#more{height:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;display:block}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 2px var(--b)}
.thumb{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:linear-gradient(135deg,#2a1846,#10324a)}
.card .name{position:absolute;inset:auto 0 0;padding:28px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--b);color:#fff}
.badge.new{background:var(--c);color:#04212e}
.fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:15px;opacity:0;transition:.15s}
.card:hover .fav,.fav.on{opacity:1}.fav.on{color:var(--a)}
.empty{color:var(--dim);padding:40px 0;text-align:center}
.ad{margin:22px 0 4px;display:flex;justify-content:center;overflow:hidden}.ad:empty{display:none}
#player{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
#player.open{display:flex}
.pbar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.pbar h1{font-size:18px;margin:0 auto 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwrap{flex:1;display:flex;min-height:0}
#frame{flex:1;border:0;background:#000;min-width:0}
.side{width:250px;overflow-y:auto;padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.side .card{flex:none}.side .thumb{aspect-ratio:16/10}.side .card .name{font-size:13px}
.note{color:var(--dim);font-size:12px;padding:4px 2px}
@media(max-width:800px){header{flex-wrap:wrap;padding:12px}.search{order:3;flex-basis:100%;max-width:none}.side{display:none}main{padding:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#" onclick="home();return false">🍍 <span>Pineapple Arcade</span></a>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search games… typos are fine" autocomplete="off">
    <kbd class="hide-sm">/</kbd>
  </label>
  <button class="btn hot" onclick="play(rand())">🎲 Random</button>
  <button class="btn hide-sm" onclick="backup()" title="Download favorites, history & play time">⬇ Backup</button>
  <button class="btn hide-sm" onclick="document.getElementById('restore').click()" title="Restore from a backup file">⬆ Restore</button>
  <input id="restore" type="file" accept=".json" hidden>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div id="shelves"></div>
  <div class="ad" id="ad-home"><!-- paste banner ad code here (stays hidden while empty) --></div>
  <h2 id="allTitle"></h2>
  <div class="grid" id="grid"></div>
  <div id="more"></div>
</main>
<div id="player">
  <div class="pbar">
    <button class="btn" onclick="location.hash=''">← Back</button>
    <h1 id="ptitle"></h1>
    <button class="btn" id="pfav"></button>
    <button class="btn" onclick="load(frame.src)" title="Restart">↻</button>
    <button class="btn" onclick="frame.requestFullscreen()" title="Fullscreen">⛶ Fullscreen</button>
    <button class="btn hide-sm" onclick="play(rand())">🎲</button>
  </div>
  <div class="pwrap">
    <iframe id="frame" allow="fullscreen; autoplay; gamepad; pointer-lock; clipboard-write" allowfullscreen></iframe>
    <div class="side"><div class="ad" id="ad-side"><!-- paste a 160-250px-wide ad code here --></div><div class="note">💾 Your progress saves automatically on this device. More like this:</div><div id="related" style="display:contents"></div></div>
  </div>
</div>
<script src="search.js"></script>
<script>
const $ = id => document.getElementById(id);
let frame = $('frame');
// fresh iframe per load so games never add entries to the browser's back history
function load(url) { const f = frame.cloneNode(); f.src = url; frame.replaceWith(f); frame = f; }
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('pa_' + k)) ?? d } catch { return d } },
  set: (k, v) => localStorage.setItem('pa_' + k, JSON.stringify(v))
};
let games = [], byId = {}, favs = new Set(store.get('favs', []).map(String)), recent = store.get('recent', []).map(String), time = store.get('time', {});
let list = [], shown = 0;
let cat = store.get('cat', 'all'), playing = null, started = 0;
navigator.storage?.persist?.(); // ask browser not to evict game saves

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const rand = () => games[Math.random() * games.length | 0].id;

function card(g) {
  const badge = g.hot ? '<span class="badge">HOT</span>' : g.new ? '<span class="badge new">NEW</span>' : '';
  return `<a class="card" href="#play/${g.id}" title="${esc(g.t)}">${badge}
    <img class="thumb" loading="lazy" src="${g.img}" alt="" onerror="this.style.visibility='hidden'">
    <button class="fav ${favs.has(g.id) ? 'on' : ''}" data-fav="${g.id}" title="Favorite">★</button>
    <div class="name">${esc(g.t)}</div></a>`;
}
// "Suggested for you": weight categories by favorites, recent plays and play time, then pick unplayed games from them
function suggested() {
  const w = {}, seen = new Set([...recent, ...favs]);
  const bump = (id, n) => byId[id]?.c.forEach(c => w[c] = (w[c] || 0) + n);
  favs.forEach(id => bump(id, 3)); recent.forEach(id => bump(id, 2));
  for (const id in time) bump(id, Math.min(time[id] / 300, 5));
  if (!Object.keys(w).length) return [];
  return games.filter(g => !seen.has(g.id) && g.c.some(c => w[c]))
    .map(g => [g.c.reduce((s, c) => s + (w[c] || 0), 0) / Math.sqrt(g.c.length) * (g.hot ? 2 : 1) * (.4 + Math.random()), g])
    .sort((a, b) => b[0] - a[0]).slice(0, 24).map(x => x[1]);
}

const shelf = (title, list) => list.length ? `<h2>${title} <small>${list.length}</small></h2><div class="rowwrap"><button class="arrow l" data-scroll="-1">‹</button><div class="row">${list.map(card).join('')}</div><button class="arrow r" data-scroll="1">›</button></div>` : '';

function render() {
  const q = $('q').value.trim();
  list = cat === 'all' ? games : cat === 'favorites' ? games.filter(g => favs.has(g.id)) : cat === 'hot' ? games.filter(g => g.hot) : cat === 'noads' ? games.filter(g => !g.ads) : games.filter(g => g.c.includes(cat));
  if (q) list = search(q, list);
  $('shelves').innerHTML = q || cat !== 'all' ? '' :
    shelf('▶ Continue playing', recent.map(id => byId[id]).filter(Boolean)) +
    shelf('✨ Suggested for you', suggested()) +
    shelf('★ Favorites', games.filter(g => favs.has(g.id))) +
    shelf('🔥 Popular', games.filter(g => g.hot).sort(() => .5 - Math.random()).slice(0, 24));
  document.querySelectorAll('.rowwrap').forEach(w => w.classList.toggle('fit', w.querySelector('.row').scrollWidth <= w.clientWidth + 4));
  $('allTitle').innerHTML = (q ? `Results for “${esc(q)}”` : cat === 'all' ? 'All games' : cat === 'noads' ? 'No-ad games' : cat[0].toUpperCase() + cat.slice(1)) + ` <small>${list.length}</small>`;
  $('grid').innerHTML = list.length ? '' : `<div class="empty">Nothing found for “${esc(q)}”. Try fewer words.</div>`;
  shown = 0; more();
}
// tens of thousands of cards: add 120 at a time as you scroll
function more() {
  if (shown >= list.length) return;
  $('grid').insertAdjacentHTML('beforeend', list.slice(shown, shown + 120).map(card).join(''));
  shown += 120;
}
new IntersectionObserver(e => e[0].isIntersecting && more(), { rootMargin: '1200px' }).observe($('more'));

function chips() {
  const counts = {};
  games.forEach(g => g.c.forEach(c => counts[c] = (counts[c] || 0) + 1));
  const cats = ['all', 'favorites', 'hot', 'noads', ...Object.keys(counts).filter(c => counts[c] >= 40).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = 'all';
  $('chips').innerHTML = cats.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-cat="${c}">${{ all: '🎮 All', favorites: '★ Favorites', hot: '🔥 Popular', noads: '🚫 No ads' }[c] || c.replace('-', ' ')}</button>`).join('');
}

function stopTimer() {
  if (playing && started) { time[playing] = (time[playing] || 0) + (Date.now() - started) / 1000; store.set('time', time); }
  started = 0;
}
function play(id) { location.hash = 'play/' + id; }
function home() { $('q').value = ''; cat = 'all'; chips(); location.hash = ''; render(); scrollTo(0, 0); }

function route() {
  const m = location.hash.match(/^#play\/([\w-]+)/), g = m && byId[m[1]];
  stopTimer();
  if (!g) { playing = null; load('about:blank'); $('player').classList.remove('open'); document.title = 'Pineapple Arcade'; render(); return; }
  playing = g.id; started = Date.now();
  recent = [g.id, ...recent.filter(x => x !== g.id)].slice(0, 20); store.set('recent', recent);
  $('player').classList.add('open');
  $('ptitle').textContent = g.t; document.title = g.t + ' · Pineapple Arcade';
  if (frame.src !== g.u) { load(g.u); window.goatcounter?.count?.({ path: 'play/' + g.t, title: g.t, event: true }); }
  favBtn();
  const rel = games.filter(x => x.id !== g.id && x.c.some(c => g.c.includes(c))).sort(() => .5 - Math.random()).slice(0, 12);
  $('related').innerHTML = rel.map(card).join('');
}
function favBtn() { $('pfav').textContent = favs.has(playing) ? '★ Favorited' : '☆ Favorite'; }
function toggleFav(id) { favs.has(id) ? favs.delete(id) : favs.add(id); store.set('favs', [...favs]); }

function backup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ favs: [...favs], recent, time })], { type: 'application/json' }));
  a.download = 'pineapple-arcade-backup.json'; a.click();
}
$('restore').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    favs = new Set((d.favs || []).map(String)); recent = (d.recent || []).map(String); time = d.time || {};
    store.set('favs', [...favs]); store.set('recent', recent); store.set('time', time); render(); alert('Restored!');
  } catch { alert('That file isn’t a Pineapple Arcade backup.'); }
  e.target.value = '';
};

document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f) { e.preventDefault(); toggleFav(f.dataset.fav); f.classList.toggle('on'); if (cat === 'favorites') render(); return; }
  const a = e.target.closest('[data-scroll]');
  if (a) { const r = a.parentNode.querySelector('.row'); r.scrollLeft += a.dataset.scroll * r.clientWidth * .85; return; }
  const c = e.target.closest('[data-cat]');
  if (c) { cat = c.dataset.cat; store.set('cat', cat); chips(); render(); }
});
$('pfav').onclick = () => { toggleFav(playing); favBtn(); };
let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(render, 120); };
$('q').onkeydown = e => { if (e.key === 'Enter') { const r = $('grid').querySelector('.card'); if (r) location.hash = r.getAttribute('href'); } };
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('q') && !playing) { e.preventDefault(); $('q').focus(); } });
addEventListener('hashchange', route);
addEventListener('pagehide', stopTimer);
document.addEventListener('visibilitychange', () => document.hidden ? stopTimer() : playing && (started = Date.now()));

fetch('games.json').then(r => r.json()).then(d => {
  const src = {
    gd: k => [`https://html5.gamedistribution.com/${k}/`, `https://img.gamedistribution.com/${k}-512x512.jpg`],
    gm: k => [`https://html5.gamemonetize.co/${k}/`, `https://img.gamemonetize.com/${k}/512x384.jpg`]
  };
  games = d;
  for (const g of games) {
    if (g.s) { [g.u, g.img] = src[g.s](g.k); g.id = g.s + '-' + g.k.slice(0, 10); }
    // GameDistribution's standard embed param: credits ad revenue share to this site once it's registered as a publisher domain
    if (g.s === 'gd') g.u += '?gd_sdk_referrer_url=' + encodeURIComponent(location.origin + location.pathname + '#play/' + g.id);
    g.id = String(g.id); byId[g.id] = g;
    g.ads = g.id.includes('-'); // GameDistribution/GameMonetize games run their own ads; the original 895 don't
  }
  chips(); route();
});
</script>
</body>
</html>
