name: Suggestions
on:
  schedule:
    - cron: "5 * * * *" # hourly: posts suggestions from the previous hour (only if there are any)
  workflow_dispatch: {} # "Run workflow" button: posts every suggestion ever
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/stats.py
        env:
          MODE: ${{ github.event_name == 'schedule' && 'new' || 'all' }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
