name: Daily stats
on:
  schedule:
    - cron: "0 13 * * *" # 8am US Eastern (9am during daylight time)
  workflow_dispatch: {}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/stats.py
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
